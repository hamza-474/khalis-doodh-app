services:
  - type: web
    name: khalis-doodh
    env: node
    plan: free
    buildCommand: corepack prepare pnpm@10.4.1 --activate && corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@khalisdoodh.pk
      - key: ADMIN_PASSWORD
        sync: false
